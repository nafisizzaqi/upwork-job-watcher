mcp_delay_seconds: 5
budget_per_hour: 140
budget_per_day: 700
poll_interval_seconds: 600
max_jobs_per_run: 5
dry_run: true
filters:
  payment_verified: true
  sort: newest
  location: worldwide
  job_types: [hourly, fixed]
  min_fixed_budget_usd: 100
  min_hourly_rate_usd: 10
  excluded_client_countries: [Pakistan, Bangladesh, Sri Lanka, India]
  max_proposals: 20
  proposal_ranges: [less_than_5, 5_to_10, 10_to_15, 15_to_20, 20_to_50]
  max_job_age_hours: 1
  min_client_rating: 4.0
  max_unhired_jobs: 50
  max_detail_checks_per_run: 10
  skip_if_offered: true
  max_search_pages: 2

keywords:
  utama: [shopify, shopify development, shopify liquid, shopify theme, shopify plus, shopify website design, shopify template, graphql, rest api development, next.js, typescript, node.js, fullstack]
  turunan_dekat: [laravel, symfony, ai implementation, saas development, php, python, django, fastapi, express.js, nestjs, vue.js, angular, svelte]
  turunan_jauh: [go developer, java, spring boot, shopify marketing, carrd, wix, wix studio, wix website design, squarespace, squarespace website, squarespace developer, squarespace customization]
blacklist:
  [
    wordpress,
    data entry,
    appointment setter,
    ReactOS,
    liquidated,
    liquidation,
    business development,
    sales development,
    lead generation,
    GoHighLevel,
    german-speaking,
    german speaking,
    deutsch,
    fluent german,
  ]
notifications:
  telegram_enabled: true
  discord_enabled: true
  notify_on_found: true
  notify_on_analyzing: true
  notify_on_draft_ready: true
  notify_on_error: true
